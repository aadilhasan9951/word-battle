<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Battle</title><link rel="stylesheet" href="style.css?v=3"></head><body><div id="toast" class="toast" hidden></div><main><section id="home" class="screen"><div class="card"><h1>⚡ Word Battle</h1><p>Fast word battles for 2–8 players.</p><input id="name" maxlength="20" autocomplete="name" placeholder="Your name"><div class="row"><button id="create" type="button">Create Game</button><button id="showJoin" type="button" class="alt">Join Game</button></div><div id="joinBox" hidden><input id="code" maxlength="4" autocomplete="off" placeholder="ROOM CODE"><button id="join" type="button">Join Room</button></div><p id="err" class="err"></p></div></section><section id="lobby" class="screen" hidden><div class="card"><h2>Room <b id="roomCode"></b></h2><p>Share the 4-character code.</p><div id="players"></div><p id="waiting" class="waiting" hidden>Waiting for another player to join…</p><label>Rounds<select id="rounds"><option>5</option><option selected>8</option><option>10</option></select></label><button id="start" type="button">Start Game</button></div></section><section id="game" class="screen" hidden><div class="bar"><span id="progress"></span><span id="score"></span></div><div class="card"><span id="kind" class="pill"></span><h2 id="prompt"></h2><div id="timer" class="timer"></div><div id="answerBox"><input id="answer" autocomplete="off" placeholder="Your answer"><div class="row"><button id="submit" type="button">Submit</button><button id="risk" type="button" hidden>Risk ×2</button></div></div><div id="gridBox" hidden></div><div id="results" hidden></div></div></section><section id="over" class="screen" hidden><div class="card"><h1>🏆 <span id="winner"></span></h1><div id="final"></div><button type="button" onclick="location.reload()">Play Again</button></div></section></main><link rel="icon" href="data:,">
<script src="app.js?v=6" defer></script></body></html>
